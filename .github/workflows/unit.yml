# Atlas's typecheck and unit suite, off the maintainers' machine. It runs when someone
# dispatches it (`gh workflow run unit.yml --ref master`) and on every pull request, a fork's
# included: master requires it, so a pull request that never ran it could never merge. It reads
# the repository and nothing else, uses no secret, and a fork's run gets none. A push to master
# runs it too, so master's own head always carries the check it requires.
name: unit

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# A newer push to the same pull request replaces the run in flight.
concurrency:
  group: unit-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p .
      # `npx vitest run`, never `npm test` (bare vitest watches and never exits).
      - run: npx vitest run

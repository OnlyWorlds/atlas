# Atlas's full end-to-end suite, off the maintainers' machine (#596).
# Manual only: it runs when
# someone dispatches it (`gh workflow run e2e.yml --ref master`), never on a push or a
# pull request, so a fork cannot start it. It reads the repository and nothing else.
name: e2e

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      # One worker, as the suite runs on the maintainers' machine, so the two routes compare.
      # A flaky's first, failing attempt keeps its trace (the config keeps only the
      # retry's, which passed): a front-door flaky once left a frame and no trace.
      - run: npx playwright test --workers=1 --reporter=list,html,junit --trace retain-on-first-failure
        env:
          CI: '1'
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: results.xml
      # The suite runs on the dev server, where no service worker registers: the update
      # banner is checked on a production build, against a real worker, in both engines.
      - name: update banner on a production build
        if: success() || failure()
        run: |
          npm run build
          node scripts/check-update-banner.mjs dist chromium
          node scripts/check-update-banner.mjs dist firefox
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            playwright-report/
            results.xml
          retention-days: 3

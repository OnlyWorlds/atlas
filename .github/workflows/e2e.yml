# Atlas's full end-to-end suite, off the maintainers' machine (#596).
# It runs when someone dispatches it (`gh workflow run e2e.yml --ref master`) and on every
# pull request opened from a branch of this repository. A fork's pull request starts
# nothing, and no push does. It reads the repository and nothing else.
name: e2e

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request replaces the run in flight.
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Pinned: ubuntu-latest moved to 26.04, where Playwright 1.60 installs no browsers.
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      # One worker, as the suite runs on the maintainers' machine, so the two routes compare.
      # A flaky's first, failing attempt keeps its trace (the config keeps only the
      # retry's, which passed): a front-door flaky once left a frame and no trace.
      - run: npx playwright test --workers=1 --reporter=list,html,junit --trace retain-on-first-failure
        env:
          CI: '1'
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: results.xml
      # The suite runs on the dev server, where no service worker registers: the update
      # banner is checked on a production build, against a real worker, in both engines.
      - name: update banner on a production build
        if: success() || failure()
        run: |
          npm run build
          node scripts/check-update-banner.mjs dist chromium
          node scripts/check-update-banner.mjs dist firefox
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            playwright-report/
            results.xml
          retention-days: 3

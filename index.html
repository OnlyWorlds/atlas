<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Atlas · OnlyWorlds</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="theme-color" content="#0a0a0a" />
  <!-- Link previews (Discord/Slack/social). og:image is an ABSOLUTE URL —
       crawlers do not run JS and resolve it against the origin, not base. The
       asset is public/og.png (1200x630, the Atlas brand card). -->
  <meta name="description" content="See, explore, create, and edit any OnlyWorlds world. Your worlds live as files, in a folder on your disk or in your browser; syncing with onlyworlds.com is optional." />
  <meta property="og:title" content="Atlas · OnlyWorlds" />
  <meta property="og:description" content="The OnlyWorlds world browser and editor. Local-first: your world is plain files, in a folder on your disk or in your browser. Charts, maps, writing, sharing, optional sync." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://atlas.onlyworlds.com/" />
  <link rel="canonical" href="https://atlas.onlyworlds.com/" />
  <meta property="og:image" content="https://atlas.onlyworlds.com/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Atlas, the local-first OnlyWorlds world editor" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Atlas · OnlyWorlds" />
  <meta name="twitter:description" content="The OnlyWorlds world browser and editor. Local-first: your world is plain files, in a folder on your disk or in your browser." />
  <meta name="twitter:image" content="https://atlas.onlyworlds.com/og.png" />
  <!-- The manifest <link> tag is injected by vite-plugin-pwa at build time
       (no manual entry — otherwise dev would 404 on /manifest.webmanifest).
       Material Symbols icons are imported via main.ts from the bundled
       material-symbols npm package, no Google Fonts CDN dependency. -->
  <link rel="stylesheet" href="/src/styles/atlas.css" />
  <!-- S360: a world folder is untrusted input and this origin holds the
       linked worlds' API keys, the PIN and the account token. No script
       runs unless it is a file served from this origin, so an injected
       onerror= or script tag is inert even if an escape is ever missed. -->
  <meta http-equiv="Content-Security-Policy" content="script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <script src="./theme-stamp.js"></script>
  <style>
    /* Browser default body margin = 8px; without this reset the shell overflows
       and leaves a thin border of body background visible on right/bottom. */
    html[data-theme='light'], html[data-theme='light'] body {
      background: #fbfbfa;
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #0a0a0a;
      /* Open Sans is the OW ecosystem standard (self-hosted @font-face in
         atlas.css, S255v2); the system stack is the pre-load fallback.
         Without an explicit body font-family, h1/h2/etc default to browser
         serif (Times New Roman on Windows). */
      font-family: 'Open Sans', system-ui, -apple-system, BlinkMacSystemFont,
                   'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif,
                   'Apple Color Emoji', 'Segoe UI Emoji';
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    #app {
      height: 100vh;
      width: 100vw;
    }
    /* Toast container — fixed bottom-right, above modals. */
    #toast-container {
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 9999;
      display: flex;
      flex-direction: column-reverse;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="toast-container" role="status" aria-live="polite"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Atlas · OnlyWorlds</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="theme-color" content="#0a0a0a" />
  <!-- Link previews (Discord/Slack/social). og:image is added alongside a
       real screenshot asset (public/og.png, 1200x630) when it lands. -->
  <meta name="description" content="See, explore, create, and edit any OnlyWorlds world. Your worlds live as files on your own disk; syncing with onlyworlds.com is optional." />
  <meta property="og:title" content="Atlas · OnlyWorlds" />
  <meta property="og:description" content="The OnlyWorlds world browser and editor. Local-first: your world is a folder on your disk. Charts, maps, writing, sharing, optional sync." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://atlas.onlyworlds.com/" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Atlas · OnlyWorlds" />
  <meta name="twitter:description" content="The OnlyWorlds world browser and editor. Local-first: your world is a folder on your disk." />
  <!-- The manifest <link> tag is injected by vite-plugin-pwa at build time
       (no manual entry — otherwise dev would 404 on /manifest.webmanifest).
       Material Symbols icons are imported via main.ts from the bundled
       material-symbols npm package, no Google Fonts CDN dependency. -->
  <link rel="stylesheet" href="/src/styles/atlas.css" />
  <style>
    /* Browser default body margin = 8px; without this reset the shell overflows
       and leaves a thin border of body background visible on right/bottom. */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #0a0a0a;
      /* Open Sans is the OW ecosystem standard (self-hosted @font-face in
         atlas.css, S255v2); the system stack is the pre-load fallback.
         Without an explicit body font-family, h1/h2/etc default to browser
         serif (Times New Roman on Windows). */
      font-family: 'Open Sans', system-ui, -apple-system, BlinkMacSystemFont,
                   'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif,
                   'Apple Color Emoji', 'Segoe UI Emoji';
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    #app {
      height: 100vh;
      width: 100vw;
    }
    /* Toast container — fixed bottom-right, above modals. */
    #toast-container {
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 9999;
      display: flex;
      flex-direction: column-reverse;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="toast-container"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
